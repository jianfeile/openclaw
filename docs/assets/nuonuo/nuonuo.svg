<svg class="nn" data-state="idle" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="糯糯">
<style>
.nn{overflow:visible;display:block}
.nn *{transform-box:fill-box}
.nn .nn-shadow{fill:var(--nn-shadow,rgba(70,45,30,.14))}
.nn .nn-body,.nn .nn-ear-out,.nn .nn-feet ellipse{fill:#C9A070;stroke:#4A3B32;stroke-width:2.5;stroke-linejoin:round}
.nn .nn-muzzle{fill:#E9D3AD}
.nn .nn-ear-in{fill:#A67C52}
.nn .nn-blush ellipse{fill:#FFB4A8;opacity:.85}
.nn .nn-eye{fill:#3A2E2A}.nn .nn-hl{fill:#fff}
.nn .nn-eye-ring{fill:#fff;stroke:#3A2E2A;stroke-width:2.5}
.nn .nn-line3{fill:none;stroke:#3A2E2A;stroke-width:3;stroke-linecap:round}
.nn .nn-nose{fill:#3A2E2A}.nn .nn-nostril{fill:#fff;opacity:.35}
.nn .nn-mouth{fill:none;stroke:#6B4E44;stroke-width:1.8;stroke-linecap:round}
.nn .nn-mouth-open{fill:#D9736A;stroke:#4A3B32;stroke-width:2;stroke-linejoin:round}.nn .nn-tongue{fill:#FFA3AA}
.nn .nn-mouth-o{fill:#6B4E44}
.nn .nn-toes{fill:none;stroke:#4A3B32;stroke-width:1.6;stroke-linecap:round}
.nn .nn-grass-stalk{fill:none;stroke:#4E9A4A;stroke-width:2.2;stroke-linecap:round}
.nn .nn-grass-leaf{fill:#6FBF6A;stroke:#4E9A4A;stroke-width:1.6;stroke-linejoin:round}
.nn .nn-bird-body{fill:#F6C453;stroke:#4A3B32;stroke-width:1.8}
.nn .nn-bird-wing{fill:#E5B13C;stroke:#4A3B32;stroke-width:1.4;stroke-linejoin:round}
.nn .nn-bird-tail{fill:#E5B13C;stroke:#4A3B32;stroke-width:1.4;stroke-linejoin:round}
.nn .nn-bird-beak{fill:#F08A3C;stroke:#4A3B32;stroke-width:1.2;stroke-linejoin:round}
.nn .nn-bird-eye{fill:#3A2E2A}
.nn .nn-fx-listen path{fill:none;stroke:#EF8C86;stroke-width:2.4;stroke-linecap:round;animation:nn-pulse 1.2s ease-in-out infinite}
.nn .nn-fx-listen path+path{animation-delay:.3s}
.nn .nn-cloud{fill:#fff;stroke:#4A3B32;stroke-width:2}
.nn .nn-dot{fill:#4A3B32;animation:nn-dots 1.2s ease-in-out infinite}
.nn .nn-dot:nth-of-type(2){animation-delay:.2s}.nn .nn-dot:nth-of-type(3){animation-delay:.4s}
.nn .nn-zzz{fill:#4A3B32;font-family:var(--font-display,"ZCOOL KuaiLe","Noto Sans SC",sans-serif);font-weight:700;animation:nn-zzz 2.7s ease-out infinite}
.nn .nn-zzz:nth-of-type(2){animation-delay:.9s}.nn .nn-zzz:nth-of-type(3){animation-delay:1.8s}
.nn .nn-bang *{fill:#EF8C86;stroke:#4A3B32;stroke-width:2}
.nn .nn-spark{fill:#FFD36E;animation:nn-twinkle 1.4s ease-in-out infinite}
.nn .nn-heart{fill:#EF8C86;animation:nn-heart 1.9s ease-out infinite}
.nn .nn-v{display:none}
.nn[data-state="idle"] [data-on~="idle"],.nn[data-state="listen"] [data-on~="listen"],.nn[data-state="think"] [data-on~="think"],
.nn[data-state="happy"] [data-on~="happy"],.nn[data-state="love"] [data-on~="love"],.nn[data-state="sleep"] [data-on~="sleep"],
.nn[data-state="surprised"] [data-on~="surprised"]{display:inline}
.nn .nn-pet{transform-origin:50% 100%}
.nn .nn-breath{transform-origin:50% 100%;animation:nn-breathe 3.4s ease-in-out infinite}
.nn .nn-eyes{transform-origin:50% 50%;animation:nn-blink 4.6s ease-in-out infinite}
.nn .nn-eyes-pos{transform-origin:50% 50%;transition:transform .35s ease}
.nn .nn-grass{transform-origin:0% 100%;animation:nn-sway 3.2s ease-in-out infinite alternate;transition:transform .5s ease}
.nn .nn-ear{transform-origin:50% 50%;transition:transform .4s ease}
.nn .nn-blush{transform-origin:50% 50%;transition:transform .4s ease}
.nn[data-state="listen"] .nn-pet{animation:nn-tilt 1.8s ease-in-out infinite alternate}
.nn[data-state="listen"] .nn-ear{animation:nn-ear-wiggle .6s ease-in-out infinite alternate}
.nn[data-state="listen"] .nn-eyes-pos{transform:scale(1.08)}
.nn[data-state="think"] .nn-eyes-pos{transform:translate(3px,-4px)}
.nn[data-state="happy"] .nn-pet{animation:nn-bounce .75s cubic-bezier(.4,.8,.5,1.1) infinite}
.nn[data-state="happy"] .nn-bird,.nn[data-state="love"] .nn-bird{transform-origin:50% 100%;animation:nn-pop .5s cubic-bezier(.3,1.5,.5,1) both}
.nn[data-state="love"] .nn-pet{animation:nn-wiggle 1.1s ease-in-out infinite}
.nn[data-state="love"] .nn-blush{transform:scale(1.3)}
.nn[data-state="sleep"] .nn-breath{animation-duration:5.2s}
.nn[data-state="sleep"] .nn-grass{transform:rotate(40deg);animation:none}
.nn[data-state="surprised"] .nn-pet{animation:nn-shake .35s ease-in-out 3}
.nn[data-state="surprised"] .nn-ear{transform:scale(1.18)}
.nn[data-state="surprised"] .nn-grass{animation:nn-hop .5s ease-out both}
.nn[data-state="surprised"] .nn-bang{transform-origin:50% 100%;animation:nn-pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes nn-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes nn-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes nn-sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes nn-ear-wiggle{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes nn-hop{0%{transform:translateY(0)}40%{transform:translateY(-9px)}70%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes nn-tilt{from{transform:rotate(-6deg)}to{transform:rotate(4deg)}}
@keyframes nn-bounce{0%,100%{transform:translateY(0) scale(1.03,.97)}45%{transform:translateY(-12px) scale(.98,1.04)}}
@keyframes nn-wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes nn-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes nn-pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes nn-dots{0%,100%{opacity:.25}30%{opacity:1}}
@keyframes nn-zzz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-14px)}}
@keyframes nn-twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
@keyframes nn-heart{0%{opacity:0;transform:translate(0,4px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(0,-30px) scale(1.1)}}
@keyframes nn-pulse{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.nn *{animation:none!important;transition:none!important}}
</style>
<defs><clipPath id="nn-nuonuo-body"><path d="M100,60 C140,60 166,84 166,118 C166,154 138,173 100,173 C62,173 34,154 34,118 C34,84 60,60 100,60 Z"/></clipPath></defs>
<ellipse class="nn-shadow" cx="100" cy="181" rx="46" ry="5"/>
<g class="nn-pet"><g class="nn-breath">
  <g class="nn-ear nn-ear-l"><circle class="nn-ear-out" cx="64" cy="66" r="8"/><circle class="nn-ear-in" cx="64" cy="67" r="4"/></g>
  <g class="nn-ear nn-ear-r"><circle class="nn-ear-out" cx="136" cy="66" r="8"/><circle class="nn-ear-in" cx="136" cy="67" r="4"/></g>
  <path class="nn-body" d="M100,60 C140,60 166,84 166,118 C166,154 138,173 100,173 C62,173 34,154 34,118 C34,84 60,60 100,60 Z"/>
  <path class="nn-muzzle" clip-path="url(#nn-nuonuo-body)" d="M60,116 C60,98 140,98 140,116 C140,146 126,158 100,158 C74,158 60,146 60,116 Z"/>
  <g class="nn-face">
    <g class="nn-blush"><ellipse cx="54" cy="118" rx="8" ry="4.5"/><ellipse cx="146" cy="118" rx="8" ry="4.5"/></g>
    <g class="nn-eyes-pos"><g class="nn-eyes nn-v" data-on="idle listen think"><circle class="nn-eye" cx="72" cy="97" r="7"/><circle class="nn-hl" cx="69.6" cy="94.6" r="2.6"/><circle class="nn-hl" cx="74.6" cy="99.4" r="1.2"/><circle class="nn-eye" cx="128" cy="97" r="7"/><circle class="nn-hl" cx="125.6" cy="94.6" r="2.6"/><circle class="nn-hl" cx="130.6" cy="99.4" r="1.2"/></g></g>
    <g class="nn-v" data-on="happy love"><path class="nn-line3" d="M64,100 C67,91 77,91 80,100"/><path class="nn-line3" d="M120,100 C123,91 133,91 136,100"/></g>
    <g class="nn-v" data-on="sleep"><path class="nn-line3" d="M65,97 C68,102 76,102 79,97"/><path class="nn-line3" d="M121,97 C124,102 132,102 135,97"/></g>
    <g class="nn-v" data-on="surprised"><circle class="nn-eye-ring" cx="72" cy="97" r="9"/><circle class="nn-eye" cx="72" cy="98" r="3.8"/><circle class="nn-hl" cx="70.8" cy="96.6" r="1.3"/><circle class="nn-eye-ring" cx="128" cy="97" r="9"/><circle class="nn-eye" cx="128" cy="98" r="3.8"/><circle class="nn-hl" cx="126.8" cy="96.6" r="1.3"/></g>
    <ellipse class="nn-nose" cx="100" cy="110" rx="9" ry="4.2"/><circle class="nn-nostril" cx="96.5" cy="110" r="1.2"/><circle class="nn-nostril" cx="103.5" cy="110" r="1.2"/>
    <path class="nn-mouth nn-v" data-on="idle listen think sleep love" d="M90,124 C94,129 106,129 110,124"/>
    <g class="nn-v" data-on="happy"><path class="nn-mouth-open" d="M90,123 C93,135 107,135 110,123 Z"/><ellipse class="nn-tongue" cx="100" cy="130.5" rx="3.6" ry="2"/></g>
    <ellipse class="nn-mouth-o nn-v" data-on="surprised" cx="100" cy="126" rx="3.2" ry="4"/>
  </g>
  <g class="nn-feet"><ellipse cx="76" cy="170" rx="12" ry="6.5"/><ellipse cx="124" cy="170" rx="12" ry="6.5"/><path class="nn-toes" d="M71,166 v5 M81,166 v5 M119,166 v5 M129,166 v5"/></g>
  <g class="nn-grass"><path class="nn-grass-stalk" d="M109,125 C116,118 122,110 126,100"/><path class="nn-grass-leaf" d="M120,110 C114,108 110,102 112,97 C118,98 121,104 120,110 Z"/><path class="nn-grass-leaf" d="M126,100 C122,94 124,86 130,84 C134,90 131,98 126,100 Z"/></g>
  <g class="nn-fx">
    <g transform="translate(120,54)"><g class="nn-bird nn-v" data-on="happy love"><path class="nn-bird-tail" d="M7,-1 l6,-4 l-2,5 z"/><ellipse class="nn-bird-body" cx="0" cy="0" rx="7" ry="5.5"/><path class="nn-bird-wing" d="M-1,-1 C3,-5 8,-3 6,2 Z"/><circle class="nn-bird-body" cx="-5" cy="-5" r="4.5"/><path class="nn-bird-beak" d="M-9.5,-5 l-4.5,1.6 l4.5,1.6 z"/><circle class="nn-bird-eye" cx="-6" cy="-6" r="0.9"/></g></g>
    <g class="nn-v nn-fx-listen" data-on="listen"><path d="M162,56 a10,10 0 0 1 0,22"/><path d="M169,49 a17,17 0 0 1 0,36"/></g>
    <g class="nn-v" data-on="think"><circle class="nn-cloud" cx="170" cy="28" r="12"/><circle class="nn-cloud" cx="158" cy="42" r="3.2"/><circle class="nn-dot" cx="164" cy="28" r="2"/><circle class="nn-dot" cx="170" cy="28" r="2"/><circle class="nn-dot" cx="176" cy="28" r="2"/></g>
    <g class="nn-v" data-on="sleep"><text class="nn-zzz" x="156" y="64" font-size="12">z</text><text class="nn-zzz" x="166" y="50" font-size="16">z</text><text class="nn-zzz" x="178" y="34" font-size="21">z</text></g>
    <g class="nn-v" data-on="surprised"><g transform="translate(170,46) rotate(12)"><g class="nn-bang"><rect x="-3" y="-16" width="6" height="18" rx="3"/><circle cy="8" r="3.4"/></g></g></g>
    <g class="nn-v" data-on="happy"><g transform="translate(34,62)"><path class="nn-spark" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z"/></g><g transform="translate(170,70)"><path class="nn-spark" style="animation-delay:.45s" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z"/></g><g transform="translate(28,126)"><path class="nn-spark" style="animation-delay:.9s" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z"/></g></g>
    <g class="nn-v" data-on="love"><g transform="translate(168,76)"><path class="nn-heart" d="M0,3 C-5,-3 -7,-7 -3.5,-8 C-1.5,-8.5 0,-6.5 0,-5.5 C0,-6.5 1.5,-8.5 3.5,-8 C7,-7 5,-3 0,3 Z"/></g><g transform="translate(34,74)"><path class="nn-heart" style="animation-delay:.6s" d="M0,3 C-5,-3 -7,-7 -3.5,-8 C-1.5,-8.5 0,-6.5 0,-5.5 C0,-6.5 1.5,-8.5 3.5,-8 C7,-7 5,-3 0,3 Z"/></g><g transform="translate(176,116)"><path class="nn-heart" style="animation-delay:1.2s" d="M0,3 C-5,-3 -7,-7 -3.5,-8 C-1.5,-8.5 0,-6.5 0,-5.5 C0,-6.5 1.5,-8.5 3.5,-8 C7,-7 5,-3 0,3 Z"/></g></g>
  </g>
</g></g>
</svg>